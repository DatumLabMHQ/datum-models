name: datum_models
version: "0.1.0"
config-version: 2
profile: datum

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  datum_models:
    +materialized: view
    +persist_docs:
      relation: true
      columns: true
    morpho:
      +schema: morpho
      staging:
        +materialized: view
      marts:
        +materialized: table
    aave:
      +schema: aave
      staging:
        +materialized: view
      marts:
        +materialized: table
    centrifuge:
      +schema: centrifuge
      staging:
        +materialized: view
      marts:
        +materialized: table
    rwa:
      +schema: rwa
      staging:
        +materialized: view
      marts:
        +materialized: table
    sui:
      +schema: sui
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table

seeds:
  datum_models:
    rwa_morpho_collateral:
      +schema: rwa
      +column_types: {chain_id: integer, collateral_address: text, symbol: text, asset_class: text, issuer: text, evidence: text}
    rwa_token_registry:
      +schema: rwa
      +column_types: {ticker: text, chain: text, address: text, decimals: integer, evidence: text}
    rwa_asset_meta:
      +schema: rwa
      +column_types: {ticker: text, asset_class: text, issuer: text, is_stablecoin: boolean, aum_scope: text}
    rwa_euler_assets:
      +schema: rwa
      +column_types: {chain_id: integer, asset_address: text, symbol: text, asset_class: text, issuer: text, evidence: text}
