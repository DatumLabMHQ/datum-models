# Hot/cold tiering. Tables listed here keep `hot_days` of history in Neon; older day partitions
# are exported to R2 as Parquet, verified, receipted in ops.cold_partitions, then deleted here.
# Curated (fct_/dim_) tables are never tiered: they are small and dashboards read them directly.
version: 1
hot_days: 60
r2:
  bucket_env: R2_BUCKET            # env var holding the bucket name
  endpoint_env: R2_ENDPOINT        # https://<accountid>.r2.cloudflarestorage.com
  access_key_env: R2_ACCESS_KEY_ID
  secret_key_env: R2_SECRET_ACCESS_KEY
tables:
  - product: sui
    table: sui.raw_pool_snapshots
    day_column: fetched_at
  - product: sui
    table: sui.raw_liquidation_events
    day_column: ts
  - product: sui
    table: sui.raw_defillama_tvl
    day_column: fetched_at
  - product: rwa
    table: rwa.raw_reserve_state_history
    day_column: ts
  - product: rwa
    table: rwa.raw_morpho_market_history
    day_column: ts
  - product: rwa
    table: rwa.raw_market_history
    day_column: ts
  - product: rwa
    table: rwa.raw_horizon_holder_history
    day_column: ts
  - product: rwa
    table: rwa.raw_asset_aum_history
    day_column: ts
  - product: rwa
    table: rwa.raw_asset_nav_history
    day_column: ts
  - product: rwa
    table: rwa.raw_token_supply_history
    day_column: ts
  - product: morpho
    table: morpho.raw_market_snapshots
    day_column: fetched_at
  - product: morpho
    table: morpho.raw_vault_snapshots
    day_column: fetched_at
  - product: morpho
    table: morpho.raw_position_snapshots
    day_column: fetched_at
  - product: aave
    table: aave.raw_reserve_snapshots
    day_column: fetched_at
  - product: centrifuge
    table: centrifuge.raw_token_snapshots
    day_column: fetched_at
