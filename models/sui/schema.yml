version: 2

models:
  - name: stg_sui__pool_snapshots
    description: Pool snapshots at raw grain with house units. Flags non-lending rows.
    columns:
      - name: snapshot_id
        tests: [unique, not_null]
      - name: protocol
        tests:
          - not_null
          - accepted_values: {values: ['navi', 'suilend', 'scallop', 'alphalend', 'bucket']}
      - name: symbol
        tests: [not_null]
      - name: utilization
        tests:
          - dbt_utils_placeholder_range:
              min: 0
              max: 100.5
              where: "is_lending_pool"

  - name: stg_sui__liquidations
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: protocol
        tests: [not_null]
      - name: ts
        tests: [not_null]

  - name: stg_sui__defillama_tvl
    tests:
      - unique_combination:
          columns: [protocol, day]
    columns:
      - name: tvl_usd
        tests: [not_null]

  - name: int_sui__pool_daily
    tests:
      - unique_combination:
          columns: [protocol, symbol, day]

  - name: dim_sui_pools
    description: One row per pool ever seen.
    tests:
      - unique_combination:
          columns: [protocol, symbol]

  - name: fct_sui_pool_daily
    description: One row per protocol, pool, UTC day. Units per datum-context/house/units.md.
    tests:
      - unique_combination:
          columns: [protocol, symbol, day]
    columns:
      - name: total_supply_usd
        tests:
          - not_null:
              where: "is_lending_pool"
      - name: utilization
        description: Percent 0..100. Above 100 fails the publish gate.
        tests:
          - dbt_utils_placeholder_range:
              min: 0
              max: 100.5
              where: "is_lending_pool"
      - name: supply_apy
        description: Percent as a number, base interest only.
      - name: ltv
        description: Percent 0..100.
        tests:
          - dbt_utils_placeholder_range: {min: 0, max: 100}

  - name: fct_sui_protocol_tvl_daily
    description: Net and gross TVL per protocol per day with the method (net or remote) recorded. Definition in datum-context/metrics/tvl-net.md.
    tests:
      - unique_combination:
          columns: [protocol, day]
    columns:
      - name: method
        tests:
          - accepted_values: {values: ['net', 'gross', 'remote']}
      - name: tvl_net_usd
        tests:
          - not_null
          - dbt_utils_placeholder_range: {min: 0, max: 100000000000}

  - name: fct_sui_liquidations
    description: One row per liquidation event.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: collateral_usd
        tests:
          - dbt_utils_placeholder_range: {min: 0, max: 1000000000}
