version: 2
sources:
  - name: rwa_raw
    schema: rwa
    description: Raw layer for the RWA terminal, copied read-only from the legacy Neon database every hour (scripts/import_legacy_rwa.py) until the worker writes here directly.
    tables:
      - name: raw_market_history
        loaded_at_field: ts
        freshness: {warn_after: {count: 3, period: hour}, error_after: {count: 12, period: hour}}
      - name: raw_reserve_state_history
        loaded_at_field: ts
        freshness: {warn_after: {count: 3, period: hour}}
      - name: raw_horizon_holder_history
        loaded_at_field: ts
      - name: raw_morpho_market_history
        loaded_at_field: ts
        freshness: {warn_after: {count: 3, period: hour}}
      - name: raw_morpho_risk_history
      - name: raw_asset_aum_history
        loaded_at_field: ts
      - name: raw_asset_nav_history
      - name: raw_token_supply_history
      - name: raw_token_top_holders
      - name: raw_asset
      - name: raw_token
      - name: raw_issuer
      - name: raw_horizon_emode
        description: Horizon e-mode categories read from the pool contract by scripts/ingest_rwa.py (rwa.horizon_emode).
        loaded_at_field: fetched_at
        freshness: {warn_after: {count: 3, period: hour}}
      - name: raw_token_supply
        description: totalSupply per tokenized asset and chain from seeds/rwa_token_registry.csv (rwa.token_supply).
        loaded_at_field: fetched_at
        freshness: {warn_after: {count: 3, period: hour}}
      - name: raw_euler_vaults
        description: Euler v2 RWA vaults from the Euler v3 API (rwa.euler).
        loaded_at_field: fetched_at
        freshness: {warn_after: {count: 3, period: hour}}
      - name: raw_euler_collaterals
        description: Accepted collaterals per Euler borrowable vault, with LTVs and debt backed (rwa.euler).
        loaded_at_field: fetched_at
