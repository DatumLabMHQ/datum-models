version: 2
sources:
  - name: aave_raw
    schema: aave
    description: Hourly reserve and market snapshots from the Aave v3 API (20 chains, every market) and the Aave v4 API (Ethereum hub).
    tables:
      - name: raw_reserve_snapshots
        loaded_at_field: fetched_at
        freshness: {warn_after: {count: 3, period: hour}, error_after: {count: 12, period: hour}}
      - name: raw_market_snapshots
        loaded_at_field: fetched_at
