name: container
# Proves the runner image builds and that the whole pipeline is runnable inside it: dependency
# imports, dbt parse, and a live connection check with the read secrets. Runs on every PR and on
# main, so a dependency drift is caught here and not in the hourly job.
on:
  pull_request: {}
  push:
    branches: [main]
    paths: [Dockerfile, requirements.lock, bin/**, .devcontainer/**, .github/workflows/container.yml]
  workflow_dispatch: {}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t datum-models .
      - name: Plan and imports
        run: docker run --rm datum-models "bin/hourly.sh --check"
      - name: dbt parse (no database)
        run: docker run --rm -e DBT_TARGET=prod -e PGHOST=x -e PGUSER=x -e PGPASSWORD=x -e PGDATABASE=x datum-models "dbt parse --profiles-dir . --target prod >/dev/null && echo parse ok"
      - name: Live connection
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL datum-models 'eval "$(python scripts/pgenv.py)" && dbt debug --profiles-dir . --target prod | tail -3'
