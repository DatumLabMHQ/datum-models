name: hourly
# Migrate, ingest, build and test. Every step logs to ops.sync_runs.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: hourly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q "dbt-core<2" "dbt-postgres<2" psycopg2-binary
      - name: Migrate
        run: python scripts/migrate.py

      # The Sui adapters live in the SuiLending repo; the platform ingest script runs them
      # and writes to the raw layer here. Nothing in the live dashboard changes.
      - uses: actions/checkout@v4
        with:
          repository: DatumLabMHQ/SuiLending
          path: _sui
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ingest Sui (pools, liquidations, DefiLlama)
        working-directory: _sui
        env:
          PLATFORM_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUI_GRPC_URL: ${{ secrets.SUI_GRPC_URL }}
          SUI_GRPC_BEARER: ${{ secrets.SUI_GRPC_BEARER }}
        run: |
          npm ci --no-audit --no-fund --silent
          npx tsx scripts/platform-ingest.ts || echo "::warning::one or more Sui ingest jobs failed (see ops.sync_runs)"

      - name: dbt build
        run: |
          eval "$(python scripts/pgenv.py)"
          dbt build --profiles-dir . --target prod
      - name: Source freshness
        if: always()
        run: |
          eval "$(python scripts/pgenv.py)"
          dbt source freshness --profiles-dir . --target prod || echo "::warning::a source is stale"
      - name: Record run
        if: always()
        run: python scripts/record_run.py --job dbt.build --status "${{ job.status }}" --runner github-actions
