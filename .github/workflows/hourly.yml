name: hourly
# Migrate, ingest, build, test, health. Fails loudly (GitHub emails the owner) when a job errored,
# a source is stale, or tests fail. Every step logs to ops.sync_runs.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: hourly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DBT_TARGET: prod
      LEGACY_RWA_DATABASE_URL: ${{ secrets.LEGACY_RWA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -q -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Hourly pipeline (bin/hourly.sh is the same script the container runs)
        env:
          SUI_GRPC_URL: ${{ secrets.SUI_GRPC_URL }}
          SUI_GRPC_BEARER: ${{ secrets.SUI_GRPC_BEARER }}
          CENTRIFUGE_API_URL: https://centrifuge-dashboard-datum.vercel.app/api/graph-proxy
          CENTRIFUGE_PROXY_KEY: ${{ secrets.CENTRIFUGE_PROXY_KEY }}
        run: bin/hourly.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-docs
          path: target/static_index.html
          retention-days: 14
          if-no-files-found: ignore
