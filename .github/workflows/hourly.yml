name: hourly
# Migrate, ingest, build and test. Every step logs to ops.sync_runs.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}
concurrency:
  group: hourly
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q dbt-postgres psycopg2-binary
      - name: Migrate
        run: python scripts/migrate.py
      - name: dbt build
        run: |
          eval "$(python scripts/pgenv.py)"
          dbt deps --profiles-dir . || true
          dbt build --profiles-dir . --target prod
      - name: Record run
        if: always()
        run: python scripts/record_run.py --job dbt.build --status "${{ job.status }}" --runner github-actions
